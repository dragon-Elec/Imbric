[pytest]
testpaths = scripts/ib/tests
python_files = test_*.py
# Defaults so no one has to remember flags to get useful output:
#   -q        condensed progress, failures still listed by name
#   --tb=short  condensed tracebacks instead of full stack dumps
# `ib` exists so failures are readable by default; its own test suite owes the
# same to whoever runs it.
addopts = -q --tb=short