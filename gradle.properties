# --- Gradle Performance ---
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
org.gradle.vfs.watch=true

# --- JBR 25 (DCEVM for Hot Reload) ---
org.gradle.java.home=/opt/jbr-25

# --- Memory ---
# Tuned for 8GB total system RAM. Increase if build OOMs.
org.gradle.jvmargs=-Xmx2g -XX:+UseG1GC -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+AllowEnhancedClassRedefinition
kotlin.daemon.jvmargs=-Xmx1g -XX:+UseG1GC -XX:+AllowEnhancedClassRedeflection
org.gradle.daemon.idletimeout=1800000
org.gradle.workers.max=2

# --- Kotlin ---
kotlin.incremental=true
